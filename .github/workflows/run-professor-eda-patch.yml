name: Run Professor EDA Patch

on:
  push:
    paths:
      - '.github/workflows/run-professor-eda-patch.yml'

permissions:
  contents: write

jobs:
  patch-review-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eda-final-profesor
          fetch-depth: 0

      - name: Extract and run patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/finalize-eda-professor.yml')
          raw = workflow.read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          script = raw.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = textwrap.dedent(script)
          exec(compile(script, '<eda-feedback-patch>', 'exec'))
          PY

      - name: Commit patched EDA to review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-eda-professor.yml
          git add notebooks/04_eda.ipynb
          git commit -m "refactor: finalize EDA from professor feedback"
          git push origin HEAD:eda-final-profesor
