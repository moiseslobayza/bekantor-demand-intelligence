name: One-shot polish EDA notebook

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-polish-eda.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update notebook markdown
        run: python scripts/polish_eda_notebook.py

      - name: Commit notebook changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/04_eda.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "Polish EDA notebook structure and synthesis"
          git push
