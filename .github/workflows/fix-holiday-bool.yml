name: Fix holiday boolean filter

on:
  push:
    branches:
      - eda-final-profesor
    paths:
      - '.github/workflows/fix-holiday-bool.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eda-final-profesor
          fetch-depth: 0

      - name: Patch notebook boolean filter
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/04_eda.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          old = 'holiday_sales = holiday_sales[~holiday_sales["is_new_year_closure"]].copy()'
          new = 'holiday_sales = holiday_sales[holiday_sales["is_new_year_closure"].eq(0)].copy()'

          replaced = 0
          for cell in nb['cells']:
              source = ''.join(cell.get('source', []))
              if old in source:
                  source = source.replace(old, new)
                  cell['source'] = source.splitlines(keepends=True)
                  cell['execution_count'] = None
                  cell['outputs'] = []
                  replaced += 1

          if replaced != 1:
              raise RuntimeError(f'Se esperaba reemplazar 1 celda y se reemplazaron {replaced}')

          path.write_text(json.dumps(nb, ensure_ascii=False, indent=1), encoding='utf-8')
          print('Filtro de Año Nuevo corregido.')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/04_eda.ipynb
          git rm .github/workflows/fix-holiday-bool.yml
          git commit -m "fix: use boolean-safe New Year holiday filter"
          git push origin HEAD:eda-final-profesor
